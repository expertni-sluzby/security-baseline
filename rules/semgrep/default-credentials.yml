# Known framework default passwords (docs/baseline.md, "Baseline rules"): a fallback to one of them, the literal in code
# (ABP's only), and the literal in appsettings*.json.
#
# The passwords are public: ABP Framework's default (the admin password of IdentityDataSeedContributor and the client
# secrets of its solution templates, in either case of the "e") and ASP.NET Boilerplate's default user password. The
# regexes spell them so that they never match themselves (gitleaks runs the same check over this repository).
#
# Test code is excluded by path: test/, tests/ and testing/ trees, `*.Tests` (and similar) projects, `*Tests.cs` files;
# so is generated C# (`*.Designer.cs`, `*ModelSnapshot.cs`, `*.g.cs`), large and never the place of such a fallback.
# `semgrep --test` ignores `paths:`, which is why the fixtures can live under tests/.
# Tests: tests/semgrep/default-credentials.* (`semgrep --test --config rules/semgrep/ tests/semgrep/`).

rules:
  - id: framework-default-password-fallback
    languages: [csharp]
    severity: ERROR
    message: >-
      Falls back to a publicly known framework default password when the setting is missing, so an environment without
      the secret runs with a password anyone can look up (ABP, ASP.NET Boilerplate). Provide the secret from a managed
      secret (a sealed / Kubernetes Secret, a key vault) and, outside the Development environment, fail or skip when it
      is missing instead of falling back; keep the default only behind a Development check
      (`if (env.IsDevelopment())`, `isDevelopment ? ... : ...`).
    metadata: &metadata
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-1392: Use of Default Credentials"
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
        - "A07:2025 - Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [dotnet, abp]
      references:
        - https://github.com/expertni-sluzby/security-baseline/blob/main/docs/baseline.md#baseline-rules
        - https://cwe.mitre.org/data/definitions/1392.html
    paths: &code-paths
      exclude:
        - "test/"
        - "tests/"
        - "testing/"
        - "*.Tests/"
        - "*.Test/"
        - "*.TestBase/"
        - "*.IntegrationTests/"
        - "*.UnitTests/"
        - "*.E2ETests/"
        - "*Tests.cs"
        - "*Test.cs"
        # Generated code (EF Core migrations and model snapshots, designers, source generators).
        - "*.Designer.cs"
        - "*ModelSnapshot.cs"
        - "*.g.cs"
        - "*.generated.cs"
    patterns:
      - pattern-either:
          - pattern: $VALUE ?? $DEFAULT
          - pattern: $VALUE ??= $DEFAULT
          - pattern: $CONFIG.GetValue($KEY, $DEFAULT)
          - pattern: $CONFIG.GetValue<$TYPE>($KEY, $DEFAULT)
          - patterns:
              - pattern-either:
                  - pattern: "$COND ? $DEFAULT : $VALUE"
                  - pattern: "$COND ? $VALUE : $DEFAULT"
              # A condition that names the Development environment is the guard this rule asks for.
              - metavariable-regex:
                  metavariable: $COND
                  regex: '^(?![\s\S]*(?i:development))'
      # The default: the literal (directly or through a constant or read-only field of the same file), ABP's own
      # IdentityDataSeedContributor.AdminPasswordDefaultValue, or a constant named as a default password
      # (DefaultAdminPassword, defaultAbpPassword) that may live in another file.
      - metavariable-pattern:
          metavariable: $DEFAULT
          pattern-either:
            - pattern: '"=~/^(?i:1q2w3e\*|123q[w]e)$/"'
            - patterns:
                - pattern-either:
                    - pattern: $NAME
                    - pattern: $OWNER.$NAME
                - metavariable-regex:
                    metavariable: $NAME
                    regex: '^(?i:_?default\w*password|\w*password_?default(value)?)$'
      # A Development guard: inside `if (env.IsDevelopment())`, `if (isDevelopment && ...)` and the like.
      - pattern-not-inside: |
          if (<... $ENV.IsDevelopment() ...>) { ... }
      - pattern-not-inside: |
          if (<... $ENV.IsEnvironment("Development") ...>) { ... }
      - pattern-not-inside: |
          if (<... isDevelopment ...>) { ... }
      - pattern-not-inside: |
          if (<... _isDevelopment ...>) { ... }
      - pattern-not-inside: |
          <... $ENV.IsDevelopment() ...> ? $A : $B
      - pattern-not-inside: |
          <... isDevelopment ...> ? $A : $B

  - id: framework-default-password-literal
    languages: [csharp]
    severity: WARNING
    message: >-
      A publicly known framework default password is written in the code (ABP); whatever uses it gets a password anyone
      can look up, in every environment. Take the value from a managed secret (a sealed / Kubernetes Secret, a key
      vault) and use a default only behind a Development check; detection code compares against a constant, which this
      rule reports once where it is defined.
    metadata: *metadata
    paths: *code-paths
    options:
      # Only the literal itself; every use of a constant that holds it is not a new finding.
      constant_propagation: false
    patterns:
      # ABP only: ASP.NET Boilerplate's default is also a common password, listed in password dictionaries (zxcvbn);
      # it is reported where it is used as a fallback or set in appsettings, not as any literal.
      - pattern: '"=~/^(?i:1q2w3e\*)$/"'
      # A fallback is reported by framework-default-password-fallback; a comparison is detection, not use.
      - pattern-not-inside: $VALUE ?? $DEFAULT
      - pattern-not-inside: $VALUE ??= $DEFAULT
      - pattern-not-inside: $CONFIG.GetValue($KEY, $DEFAULT)
      - pattern-not-inside: $CONFIG.GetValue<$TYPE>($KEY, $DEFAULT)
      - pattern-not-inside: $A == $B
      - pattern-not-inside: $A != $B
      - pattern-not-inside: |
          if (<... $ENV.IsDevelopment() ...>) { ... }
      - pattern-not-inside: |
          if (<... $ENV.IsEnvironment("Development") ...>) { ... }
      - pattern-not-inside: |
          if (<... isDevelopment ...>) { ... }
      - pattern-not-inside: |
          <... $ENV.IsDevelopment() ...> ? $A : $B
      - pattern-not-inside: |
          <... isDevelopment ...> ? $A : $B

  - id: framework-default-password-in-appsettings
    languages: [json]
    severity: WARNING
    message: >-
      A publicly known framework default password is set in appsettings (ABP, ASP.NET Boilerplate); every environment
      that does not override the key runs with a password anyone can look up. Leave the key empty (or out) here, provide
      the secret from a managed secret (a sealed / Kubernetes Secret, a key vault) and, outside the Development
      environment, fail or skip when it is missing; a local default belongs in appsettings.Development.json.
    metadata: *metadata
    paths:
      include:
        - "appsettings*.json"
      exclude:
        - "appsettings.Development*.json"
        - "appsettings.Local*.json"
        - "appsettings.Test*.json"
        - "appsettings.Prod*.json"
        - "test/"
        - "tests/"
        - "testing/"
        - "*.Tests/"
        - "*.Test/"
        - "*.TestBase/"
        - "*.IntegrationTests/"
        - "*.UnitTests/"
        - "*.E2ETests/"
    pattern: '"=~/^(?i:1q2w3e\*|123q[w]e)$/"'

  - id: framework-default-password-in-production-appsettings
    languages: [json]
    severity: ERROR
    message: >-
      A publicly known framework default password is set in the production appsettings (ABP, ASP.NET Boilerplate), so
      production runs with a password anyone can look up. Remove it, provide the secret from a managed secret (a sealed
      / Kubernetes Secret, a key vault) and fail or skip when it is missing; rotate the credential if it was ever used.
    metadata: *metadata
    paths:
      include:
        - "appsettings.Prod*.json"
    pattern: '"=~/^(?i:1q2w3e\*|123q[w]e)$/"'
