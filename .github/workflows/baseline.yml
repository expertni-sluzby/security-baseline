# L1 baseline scanners (docs/PLAN.md §7.1) as a reusable workflow.
#
# Consumers call it with explicit secrets (never `secrets: inherit`):
#
#   jobs:
#     baseline:
#       uses: expertni-sluzby/security-baseline/.github/workflows/baseline.yml@v1
#       with:
#         defectdojo-url: ${{ vars.DEFECTDOJO_URL }}
#       secrets:
#         DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
#
# Supply chain: every scanner is a release binary (or image) pinned by version AND sha256,
# every action is pinned by commit SHA, and versions are at least 14 days old when pinned.
# No third-party scanner actions — tags of those have been hijacked before (trivy-action, 2026).
# Nothing from `${{ }}` is interpolated into a `run:` script; values travel through `env:`.
# Reports are uploaded as artifacts, which are PUBLIC on public repos: secret scanners run
# with redaction, and nothing writes a secret value into a report.
name: baseline

on:
  workflow_call:
    inputs:
      product:
        description: "DefectDojo product name (default: the repository name)"
        type: string
        default: ""
      product-type:
        description: "DefectDojo product type (default: the repository owner or organization)"
        type: string
        default: ""
      defectdojo-url:
        description: "DefectDojo base URL; pass vars.DEFECTDOJO_URL. Empty means no upload."
        type: string
        default: ""
      enforce:
        description: >-
          Fail on dependency / IaC / SAST / workflow findings at or above fail-on.
          Secrets always fail a pull_request or push run, whatever this says.
        type: boolean
        default: false
      fail-on:
        description: "Lowest severity that blocks when enforce is on: high or critical"
        type: string
        default: high
    secrets:
      DEFECTDOJO_TOKEN:
        required: false

permissions: {}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRUFFLEHOG_VERSION: 3.99.0
  TRUFFLEHOG_SHA256: e35ae3fd1e4b7a0c1699d0fda1814282bf906d03379bd4337b092b3a84c6740b
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
  ZIZMOR_VERSION: 1.30.1
  ZIZMOR_SHA256: eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
  # jq helpers shared by the Verdict steps. A workflow command (`::error file=..,line=..,title=..::msg`)
  # needs `%` and newlines percent-encoded, and `:` and `,` as well inside property values; `cell`
  # makes a value safe inside a markdown table. annotation(level) takes {file, line, end, title, msg};
  # file may be empty (no location), line may be 0 (file only).
  JQ_GH: |-
    def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
    def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
    def cell: tostring | gsub("\\|"; "\\|") | gsub("\r?\n"; " ");
    def annotation(level):
      "::\(level) " + ([
        (if (.file // "") != "" then "file=\(.file | prop)" else empty end),
        (if (.file // "") != "" and (.line // 0) > 0 then "line=\(.line)" else empty end),
        (if (.file // "") != "" and (.line // 0) > 0 and (.end // 0) >= .line then "endLine=\(.end)" else empty end),
        "title=\(.title | prop)"
      ] | join(",")) + "::" + (.msg | esc);

jobs:
  secrets:
    name: secrets (gitleaks + trufflehog)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      blocking: ${{ steps.verdict.outputs.blocking }}
      detail: ${{ steps.verdict.outputs.detail }}
      scope: ${{ steps.range.outputs.scope }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks and trufflehog (pinned, checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          curl -fsSL -o th.tgz "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  th.tgz" | sha256sum -c -
          tar -xzf gl.tgz -C "$RUNNER_TEMP/bin" gitleaks
          tar -xzf th.tgz -C "$RUNNER_TEMP/bin" trufflehog
          rm gl.tgz th.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Resolve the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Pull requests and pushes scan only the new commits (new leaks block);
          # scheduled / manual runs scan the full history (reported, see the gate).
          base=""
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then base="$PUSH_BEFORE"
          fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=""; fi
          # The defectdojo job closes secret findings only after a full-history scan.
          scope=full; [ -n "$base" ] && scope=incremental
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Scanning ${base:+$base..}HEAD"
      - name: gitleaks
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p reports
          opts="--no-merges"
          [ -n "$BASE" ] && opts="--no-merges $BASE..HEAD"
          gitleaks git --log-opts="$opts" --redact --no-banner --exit-code 0 \
            --report-format json --report-path reports/gitleaks.json .
      - name: trufflehog (verified secrets only)
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail
          # --branch HEAD: checkout with fetch-depth 0 brings every branch, and trufflehog scans
          # all of them by default — a PR would then "find" other branches' history.
          args=(git file://. --branch HEAD --only-verified --json --no-update)
          [ -n "$BASE" ] && args+=(--since-commit "$BASE")
          trufflehog "${args[@]}" > reports/trufflehog.raw.json
          # Never let a secret value reach an artifact.
          jq -c '.Raw = "[redacted]" | .RawV2 = "[redacted]"' reports/trufflehog.raw.json > reports/trufflehog.json
          rm reports/trufflehog.raw.json
      - id: verdict
        name: Verdict
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ steps.range.outputs.scope }}
        run: |
          set -euo pipefail
          # Locations and rule names only, never a value: gitleaks ran with --redact and
          # trufflehog's Raw/RawV2 were replaced above.
          jq -c '.[] | {tool: "gitleaks", rule: .RuleID, file: .File, line: .StartLine, end: 0,
                        commit: .Commit[0:8], fingerprint: .Fingerprint}' reports/gitleaks.json > findings.jsonl
          jq -c '{tool: "trufflehog", rule: .DetectorName, file: (.SourceMetadata.Data.Git.file // ""),
                  line: (.SourceMetadata.Data.Git.line // 0), end: 0,
                  commit: ((.SourceMetadata.Data.Git.commit // "")[0:8]), fingerprint: ""}' reports/trufflehog.json >> findings.jsonl
          jq -s '.' findings.jsonl > findings.json
          gl=$(jq 'length' reports/gitleaks.json)
          n=$(jq 'length' findings.json)
          th=$((n - gl))
          scanned="the new commits"; [ "$SCOPE" = full ] && scanned="the full history"
          # A new leak blocks a pull request or push; full-history hits are reported (see the gate).
          level=warning; { [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; } && level=error
          detail=$(jq -r '.[:3] | map("\(.tool) \(.rule) in \(.file):\(.line) (commit \(.commit))") | join("; ")' findings.json | tr -d '\n\r')
          [ "$n" -gt 3 ] && detail="$detail; +$((n - 3)) more"
          echo "blocking=$n" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          jq -r --arg level "$level" "$JQ_GH"'.[:10][]
            | .title = "secret: \(.tool) \(.rule)"
            | .msg = "Commit \(.commit): \(.tool) rule \(.rule) matched in \(.file):\(.line). Rotate the secret first, then remove it from the code (docs/PLAN.md §8). A rotated secret that stays in the history is ignored by its fingerprint in .gitleaksignore (docs/baseline.md)."
            | annotation($level)' findings.json
          {
            echo "### Secrets"
            echo "$n finding(s) in $scanned: gitleaks $gl, trufflehog (verified) $th."
            if [ "$n" != 0 ]; then
              echo
              echo "| tool | rule | location | commit | gitleaks fingerprint (for .gitleaksignore, once rotated) |"
              echo "|---|---|---|---|---|"
              jq -r "$JQ_GH"'.[:50][] | "| \(.tool) | `\(.rule | cell)` | `\(.file | cell):\(.line)` | \(.commit) | \(if .fingerprint != "" then "`\(.fingerprint | cell)`" else "" end) |"' findings.json
              echo
              echo "Rotate the secret first, then remove it from the code (docs/PLAN.md §8). No report contains the value itself."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-secrets
          path: reports/
          retention-days: 7

  dependencies:
    name: dependencies (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      blocking: ${{ steps.verdict.outputs.blocking }}
      lockfiles: ${{ steps.verdict.outputs.lockfiles }}
      detail: ${{ steps.verdict.outputs.detail }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: osv-scanner
        run: |
          set -euo pipefail
          mkdir -p reports
          # osv-scanner reads an osv-scanner.toml only next to each lockfile; the repository's root one (its list
          # of ignored advisories) is passed explicitly, so that it covers the lockfiles in subdirectories too.
          config=()
          [ -f osv-scanner.toml ] && config=(--config osv-scanner.toml)
          set +e
          osv-scanner scan source --recursive "${config[@]}" --format json --output-file reports/osv.json .
          rc=$?
          set -e
          # 0 = clean, 1 = vulnerabilities found, 128 = no lockfiles; anything else is a crash.
          case "$rc" in
            0|1) ;;
            128) echo '{"results":[]}' > reports/osv.json; echo "No lockfiles found." ;;
            *) echo "osv-scanner failed with exit code $rc"; exit "$rc" ;;
          esac
      - id: verdict
        name: Verdict
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          min=7.0; [ "$FAIL_ON" = critical ] && min=9.0
          level=warning; [ "$ENFORCE" = true ] && level=error
          # One row per advisory and package version. osv-scanner reports a group per lockfile, so one
          # advisory in the four lockfiles of one module used to read as "4 findings".
          jq --argjson min "$min" --arg ws "$GITHUB_WORKSPACE/" '
            [ .results[]? as $r | $r.packages[]? as $p | $p.groups[]? as $g
              | ($g.max_severity | tonumber? // 0) as $sev
              | [ $p.vulnerabilities[]? | select(.id as $id | $g.ids | index($id)) ] as $vulns
              | { pkg: $p.package.name, version: $p.package.version, ids: $g.ids, sev: $sev, blocking: ($sev >= $min),
                  lockfile: ($r.source.path | ltrimstr($ws)),
                  summary: ([ $vulns[].summary // empty ] | first // ""),
                  fixed: ([ $vulns[].affected[]? | select(.package.name == $p.package.name) | .ranges[]?.events[]?.fixed // empty ] | unique) } ]
            | group_by([.pkg, .version, .ids]) | map(.[0] + { lockfiles: (map(.lockfile) | unique) } | del(.lockfile))
            | sort_by(-.sev, .pkg)' reports/osv.json > advisories.json
          n=$(jq '[.[] | select(.blocking)] | length' advisories.json)
          total=$(jq 'length' advisories.json)
          lockfiles=$(jq '[.[] | select(.blocking) | .lockfiles[]] | unique | length' advisories.json)
          detail=$(jq -r '[.[] | select(.blocking)][:3]
            | map("\(.pkg)@\(.version) \(.ids | join("/")) (CVSS \(.sev)\(if (.fixed | length) > 0 then ", fixed in \(.fixed | join(", "))" else ", no fixed version yet" end))")
            | join("; ")' advisories.json | tr -d '\n\r')
          [ "$n" -gt 3 ] && detail="$detail; +$((n - 3)) more"
          echo "blocking=$n" >> "$GITHUB_OUTPUT"
          echo "lockfiles=$lockfiles" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          jq -r --arg level "$level" "$JQ_GH"'[.[] | select(.blocking)][:10][]
            | .file = .lockfiles[0] | .line = 0 | .end = 0
            | .title = "dependency: \(.pkg)@\(.version) \(.ids | join("/"))"
            | .msg = "CVSS \(.sev): \(.summary | rtrimstr(".")). \(if (.fixed | length) > 0 then "Fixed in \(.fixed | join(", "))." else "No fixed version yet." end) In \(.lockfiles | length) lockfile(s): \(.lockfiles[:5] | join(", "))\(if (.lockfiles | length) > 5 then ", ..." else "" end). https://osv.dev/vulnerability/\(.ids[0])"
            | annotation($level)' advisories.json
          {
            echo "### Dependencies"
            echo "$total advisories in total, $n at or above CVSS $min (in $lockfiles lockfile(s))."
            if [ "$n" != 0 ]; then
              echo
              echo "| CVSS | package | advisory | fixed in | lockfiles |"
              echo "|---|---|---|---|---|"
              jq -r "$JQ_GH"'.[] | select(.blocking)
                | "| \(.sev) | `\(.pkg | cell)@\(.version | cell)` | [\(.ids | join(", "))](https://osv.dev/vulnerability/\(.ids[0])) \(.summary | cell) | \(if (.fixed | length) > 0 then (.fixed | join(", ")) else "none yet" end) | \(.lockfiles | map("`\(cell)`") | join("<br>")) |"' advisories.json
              echo
              echo "Fix: upgrade to a fixed version. An advisory whose vulnerable code this repository cannot reach is ignored in \`osv-scanner.toml\` at the repository root (\`[[IgnoredVulns]]\` with \`id\`, \`reason\` and \`ignoreUntil\`); one that is merely inconvenient is fixed, or accepted in DefectDojo (docs/baseline.md)."
            fi
            if [ "$total" -gt "$n" ]; then
              echo
              echo "<details><summary>$((total - n)) below the threshold (reported, not blocking)</summary>"
              echo
              echo "| CVSS | package | advisory | fixed in |"
              echo "|---|---|---|---|"
              jq -r "$JQ_GH"'[.[] | select(.blocking | not)][:30][]
                | "| \(.sev) | `\(.pkg | cell)@\(.version | cell)` | [\(.ids | join(", "))](https://osv.dev/vulnerability/\(.ids[0])) \(.summary | cell) | \(if (.fixed | length) > 0 then (.fixed | join(", ")) else "none yet" end) |"' advisories.json
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-dependencies
          path: reports/
          retention-days: 7

  iac:
    name: iac (trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      blocking: ${{ steps.verdict.outputs.blocking }}
      detail: ${{ steps.verdict.outputs.detail }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C "$RUNNER_TEMP/bin" trivy
          rm trivy.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: trivy config (Dockerfile, Helm, Kubernetes, Terraform)
        run: |
          set -euo pipefail
          mkdir -p reports
          trivy config --quiet --format json --output reports/trivy-config.json --exit-code 0 .
      - id: verdict
        name: Verdict
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          sev='["HIGH","CRITICAL"]'; threshold=HIGH; [ "$FAIL_ON" = critical ] && { sev='["CRITICAL"]'; threshold=CRITICAL; }
          level=warning; [ "$ENFORCE" = true ] && level=error
          jq --argjson sev "$sev" '
            [ .Results[]? as $r | ($r.Misconfigurations // [])[] | select(.Status != "PASS")
              | { id: (.AVDID // .ID), sev: .Severity, blocking: ((.Severity as $s | $sev | index($s)) != null),
                  name: .Title, file: $r.Target, line: (.CauseMetadata.StartLine // 0), end: (.CauseMetadata.EndLine // 0),
                  resolution: (.Resolution // ""), url: (.PrimaryURL // "") } ]
            | sort_by((.sev as $s | ["CRITICAL", "HIGH", "MEDIUM", "LOW"] | index($s)) // 9, .file, .line)' reports/trivy-config.json > misconfigurations.json
          n=$(jq '[.[] | select(.blocking)] | length' misconfigurations.json)
          total=$(jq 'length' misconfigurations.json)
          detail=$(jq -r '[.[] | select(.blocking)][:3] | map("\(.id) \(.sev) in \(.file):\(.line) (\(.name))") | join("; ")' misconfigurations.json | tr -d '\n\r')
          [ "$n" -gt 3 ] && detail="$detail; +$((n - 3)) more"
          echo "blocking=$n" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          jq -r --arg level "$level" "$JQ_GH"'[.[] | select(.blocking)][:10][]
            | .title = "iac: \(.id) \(.sev)" | .msg = "\(.name). \(.resolution) \(.url)" | annotation($level)' misconfigurations.json
          {
            echo "### IaC"
            echo "$total misconfigurations in total, $n at or above $threshold."
            if [ "$n" != 0 ]; then
              echo
              echo "| severity | check | location | finding | resolution |"
              echo "|---|---|---|---|---|"
              jq -r "$JQ_GH"'.[] | select(.blocking)
                | "| \(.sev) | \(if .url != "" then "[\(.id)](\(.url))" else .id end) | `\(.file | cell):\(.line)` | \(.name | cell) | \(.resolution | cell) |"' misconfigurations.json
              echo
              echo "Fix: change the configuration as the resolution says. A confirmed false positive is listed by its check ID in \`.trivyignore\` at the repository root, with a comment saying why."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-iac
          path: reports/
          retention-days: 7

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      blocking: ${{ steps.verdict.outputs.blocking }}
      detail: ${{ steps.verdict.outputs.detail }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep (pinned image digest, metrics off)
        run: |
          set -euo pipefail
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --metrics off --disable-version-check \
            --json --output reports/semgrep.json .
      - id: verdict
        name: Verdict
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          # Rules use either ERROR/WARNING/INFO or LOW..CRITICAL; ERROR counts as high.
          sev='["ERROR","HIGH","CRITICAL"]'; threshold=ERROR/HIGH; [ "$FAIL_ON" = critical ] && { sev='["CRITICAL"]'; threshold=CRITICAL; }
          level=warning; [ "$ENFORCE" = true ] && level=error
          jq --argjson sev "$sev" '
            [ .results[] | { id: .check_id, sev: .extra.severity, blocking: ((.extra.severity as $s | $sev | index($s)) != null),
                file: .path, line: .start.line, end: .end.line, msg: ((.extra.message // "") | split("\n")[0]),
                url: (.extra.metadata.shortlink // "") } ]
            | sort_by((.sev as $s | ["CRITICAL", "ERROR", "HIGH", "MEDIUM", "WARNING", "LOW", "INFO"] | index($s)) // 9, .file, .line)' reports/semgrep.json > findings.json
          n=$(jq '[.[] | select(.blocking)] | length' findings.json)
          total=$(jq 'length' findings.json)
          errors=$(jq '.errors | length' reports/semgrep.json)
          detail=$(jq -r '[.[] | select(.blocking)][:3] | map("\(.id) \(.sev) in \(.file):\(.line)") | join("; ")' findings.json | tr -d '\n\r')
          [ "$n" -gt 3 ] && detail="$detail; +$((n - 3)) more"
          echo "blocking=$n" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          jq -r --arg level "$level" "$JQ_GH"'[.[] | select(.blocking)][:10][]
            | .title = "sast: \(.id) \(.sev)" | .msg = "\(.msg[:300]) \(.url)" | annotation($level)' findings.json
          {
            echo "### SAST"
            echo "$total results in total, $n at or above $threshold ($errors scan errors)."
            if [ "$n" != 0 ]; then
              echo
              echo "| severity | rule | location | message |"
              echo "|---|---|---|---|"
              jq -r "$JQ_GH"'.[] | select(.blocking)
                | "| \(.sev) | \(if .url != "" then "[\(.id | cell)](\(.url))" else (.id | cell) end) | `\(.file | cell):\(.line)` | \(.msg[:200] | cell) |"' findings.json
              echo
              echo "Fix: change the code as the rule says. A confirmed false positive gets a \`nosemgrep: <rule-id>\` comment on its line; a path that should not be scanned (generated or vendored code) goes to \`.semgrepignore\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-sast
          path: reports/
          retention-days: 7

  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      blocking: ${{ steps.verdict.outputs.blocking }}
      detail: ${{ steps.verdict.outputs.detail }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (pinned wheel, hash-verified)
        run: |
          set -euo pipefail
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > "$RUNNER_TEMP/zizmor-req.txt"
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary :all: --require-hashes -r "$RUNNER_TEMP/zizmor-req.txt"
          echo "$RUNNER_TEMP/zizmor/bin" >> "$GITHUB_PATH"
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ ! -d .github ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"zizmor"}},"results":[]}]}' > reports/zizmor.sarif
            exit 0
          fi
          set +e
          zizmor --format sarif --no-progress . > reports/zizmor.sarif
          rc=$?
          set -e
          # zizmor exits non-zero when it reports findings (10-14); only a crash (other codes) fails here.
          case "$rc" in 0|1[0-4]) ;; *) echo "zizmor failed with exit code $rc"; exit "$rc" ;; esac
      - id: verdict
        name: Verdict
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          level=warning; [ "$ENFORCE" = true ] && level=error
          # SARIF level error = zizmor high. Rule IDs are "zizmor/<audit>", documented at docs.zizmor.sh/audits/#<audit>.
          jq '
            [ .runs[].results[] | { id: (.ruleId | ltrimstr("zizmor/")), level: (.level // "note"), blocking: (.level == "error"),
                file: (.locations[0].physicalLocation.artifactLocation.uri // ""),
                line: (.locations[0].physicalLocation.region.startLine // 0), end: (.locations[0].physicalLocation.region.endLine // 0),
                msg: ((.message.text // "") | split("\n")[0]) } ]
            | sort_by((.level as $l | ["error", "warning", "note"] | index($l)) // 9, .file, .line)' reports/zizmor.sarif > findings.json
          n=$(jq '[.[] | select(.blocking)] | length' findings.json)
          total=$(jq 'length' findings.json)
          detail=$(jq -r '[.[] | select(.blocking)][:3] | map("\(.id) in \(.file):\(.line)") | join("; ")' findings.json | tr -d '\n\r')
          [ "$n" -gt 3 ] && detail="$detail; +$((n - 3)) more"
          echo "blocking=$n" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          jq -r --arg level "$level" "$JQ_GH"'[.[] | select(.blocking)][:10][]
            | .title = "workflow: \(.id) high" | .msg = "\(.msg) https://docs.zizmor.sh/audits/#\(.id)" | annotation($level)' findings.json
          {
            echo "### CI workflows"
            echo "$total findings in total, $n high."
            if [ "$n" != 0 ]; then
              echo
              echo "| severity | audit | location | finding |"
              echo "|---|---|---|---|"
              jq -r "$JQ_GH"'.[] | select(.blocking)
                | "| high | [\(.id | cell)](https://docs.zizmor.sh/audits/#\(.id)) | `\(.file | cell):\(.line)` | \(.msg | cell) |"' findings.json
              echo
              echo "Fix: change the workflow as the audit says. A confirmed false positive gets a \`# zizmor: ignore[<audit>]\` comment on its line."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-workflows
          path: reports/
          retention-days: 7

  defectdojo:
    name: upload to DefectDojo
    # Only reviewed code reaches the findings store: pushes, scheduled and manual runs.
    # Pull requests are gated in CI but not recorded (fork PRs carry no secrets anyway).
    if: ${{ always() && github.event_name != 'pull_request' && inputs.defectdojo-url != '' }}
    needs: [secrets, dependencies, iac, sast, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: baseline-*
          path: reports
          merge-multiple: true
      - name: reimport-scan
        env:
          DD_URL: ${{ inputs.defectdojo-url }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          PRODUCT: ${{ inputs.product }}
          PRODUCT_TYPE: ${{ inputs.product-type }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SECRETS_SCOPE: ${{ needs.secrets.outputs.scope }}
        run: |
          set -euo pipefail
          if [ -z "$DD_TOKEN" ]; then
            echo "::warning::defectdojo-url is set but DEFECTDOJO_TOKEN was not passed; nothing uploaded."
            exit 0
          fi
          product="${PRODUCT:-${REPO#*/}}"
          ptype="${PRODUCT_TYPE:-$OWNER}"
          failed=0
          upload() { # <file> <scan type> <test title> [close old findings: true|false]
            local close="${4:-true}"
            [ -s "reports/$1" ] || { echo "skip $1 (missing)"; return 0; }
            # The token goes through curl's config on stdin, never the command line.
            code=$(printf 'header = "Authorization: Token %s"\n' "$DD_TOKEN" | curl -sS -K - \
              -o /tmp/dd-resp.json -w '%{http_code}' "${DD_URL%/}/api/v2/reimport-scan/" \
              -F "scan_type=$2" -F "test_title=$3" -F "file=@reports/$1" \
              -F auto_create_context=true -F "product_type_name=$ptype" -F "product_name=$product" \
              -F "engagement_name=ci/$REF_NAME" -F deduplication_on_engagement=true \
              -F "close_old_findings=$close" -F active=true -F verified=false -F minimum_severity=Info \
              -F "version=$SHA" -F "commit_hash=$SHA" -F "branch_tag=$REF_NAME" \
              -F "build_id=$RUN_URL" -F "source_code_management_uri=$REPO_URL") || code=000
            if [ "$code" = 201 ]; then echo "uploaded $1 ($3, close_old_findings=$close)"
            else echo "::error::DefectDojo rejected $1 with HTTP $code: $(head -c 300 /tmp/dd-resp.json)"; failed=1
            fi
          }
          # A push scans only the pushed commits for secrets, so a history finding missing from its
          # report is not gone; closing it would flip it closed on every push and open every night.
          # Only a full-history scan (schedule, dispatch, a push without a usable base) closes them.
          secrets_close=false; [ "$SECRETS_SCOPE" = full ] && secrets_close=true
          upload gitleaks.json     "Gitleaks Scan"       "gitleaks"   "$secrets_close"
          upload trufflehog.json   "Trufflehog Scan"     "trufflehog" "$secrets_close"
          upload osv.json          "OSV Scan"            "osv-scanner"
          upload trivy-config.json "Trivy Scan"          "trivy config"
          upload semgrep.json      "Semgrep JSON Report" "semgrep"
          upload zizmor.sarif      "SARIF"               "zizmor"
          rm -f /tmp/dd-resp.json
          exit "$failed"

  gate:
    name: gate
    if: ${{ always() }}
    needs: [secrets, dependencies, iac, sast, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Decide
        # The gate is the one red job a user sees, so its annotations say what blocked (the first
        # findings by name), where the full list is (the run's Summary page) and what to do about it.
        # The scanner jobs annotate the findings on file and line and write the tables.
        env:
          EVENT: ${{ github.event_name }}
          ENFORCE: ${{ inputs.enforce }}
          FAIL_ON: ${{ inputs.fail-on }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          summary() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
          # A scanner that did not finish is unknown, and unknown never passes.
          crashed=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<<"$RESULTS")
          if [ -n "$crashed" ]; then
            echo "::error title=gate blocked (a scanner did not finish)::The job(s) $crashed did not succeed, so nothing is known about what they scan and the gate fails. Open the job for its log; if the cause was transient (a download, the network), re-run the failed jobs."
            summary "### Gate: failed" "" "Scanner job(s) did not finish: $crashed. Open the job for its log; re-run the failed jobs if the cause was transient."
            exit 1
          fi
          get() { jq -r --arg k "$1" --arg f "$2" '.[$k].outputs[$f] // ""' <<<"$RESULTS"; }
          plural() { if [ "$1" = 1 ]; then echo "${2%%|*}"; else echo "${2##*|}"; fi; }
          where="the Summary page of this run"
          declare -A section=([dependencies]=Dependencies [iac]=IaC [sast]=SAST [workflows]="CI workflows")
          declare -A noun=([dependencies]="advisory|advisories" [iac]="misconfiguration|misconfigurations" [sast]="SAST finding|SAST findings" [workflows]="workflow finding|workflow findings")
          declare -A threshold=([dependencies]="CVSS 7.0" [iac]="HIGH" [sast]="ERROR/HIGH" [workflows]="high")
          [ "$FAIL_ON" = critical ] && threshold=([dependencies]="CVSS 9.0" [iac]="CRITICAL" [sast]="CRITICAL" [workflows]="high")
          declare -A fix=(
            [dependencies]="upgrade to a fixed version; an advisory whose vulnerable code the repository cannot reach is ignored in osv-scanner.toml with a reason and an ignoreUntil"
            [iac]="change the configuration as the resolution says; a confirmed false positive is listed in .trivyignore"
            [sast]="change the code as the rule says; a confirmed false positive gets a nosemgrep comment on its line, a path that should not be scanned goes to .semgrepignore"
            [workflows]="change the workflow as the audit says (docs.zizmor.sh/audits); a confirmed false positive gets a zizmor: ignore comment on its line"
          )
          fail=0
          rows=""
          blocked=""
          s=$(get secrets blocking); s=${s:-0}
          if [ "$s" = 0 ]; then
            rows+="| secrets | 0 | ok |"$'\n'
          elif [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            scanned="the new commits"; [ "$(get secrets scope)" = full ] && scanned="the history (this $EVENT had no usable base commit, so the whole history was scanned)"
            echo "::error title=gate blocked by secrets::$s secret $(plural "$s" "finding|findings") in $scanned: $(get secrets detail). Rotate the secret first, then remove it from the code (docs/PLAN.md §8). Locations: the annotations of the job \"secrets (gitleaks + trufflehog)\" and $where, section Secrets."
            rows+="| secrets | $s in $scanned | **blocks** |"$'\n'
            blocked+="- **secrets**: $(get secrets detail). Rotate the secret first, then remove it from the code (docs/PLAN.md §8)."$'\n'
            fail=1
          else
            echo "::warning title=gate report (secrets in the history)::$s secret $(plural "$s" "finding|findings") in the full history: $(get secrets detail). Reported, not blocking on $EVENT. A rotated secret that stays in the history is ignored by its fingerprint in .gitleaksignore (docs/baseline.md)."
            rows+="| secrets | $s in the full history | reported |"$'\n'
          fi
          for k in dependencies iac sast workflows; do
            n=$(get "$k" blocking); n=${n:-0}
            if [ "$n" = 0 ]; then rows+="| $k | 0 | ok |"$'\n'; continue; fi
            what="$n $(plural "$n" "${noun[$k]}") at or above ${threshold[$k]}"
            if [ "$k" = dependencies ]; then l=$(get dependencies lockfiles); what="$what in $l $(plural "$l" "lockfile|lockfiles")"; fi
            d=$(get "$k" detail)
            if [ "$ENFORCE" = true ]; then
              echo "::error title=gate blocked by $k::$what: $d. Full list: $where, section ${section[$k]}. Fix: ${fix[$k]} (docs/baseline.md)."
              rows+="| $k | $what | **blocks** |"$'\n'
              blocked+="- **$k**: $d. Fix: ${fix[$k]} (docs/baseline.md)."$'\n'
              fail=1
            else
              echo "::warning title=gate report ($k, enforce is false)::$what: $d. Not blocking: enforce is false. Full list: $where, section ${section[$k]}."
              rows+="| $k | $what | reported (enforce: false) |"$'\n'
            fi
          done
          verdict=passed; [ "$fail" = 1 ] && verdict=failed
          summary "### Gate: $verdict" "" "| scanner | at or above the threshold | verdict |" "|---|---|---|"
          printf '%s' "$rows" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$blocked" ]; then
            summary "" "What blocks, and what to do:" ""
            printf '%s' "$blocked" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$fail" = 1 ] && [ "$EVENT" = pull_request ]; then
            note="The scanners look at the whole repository at this pull request's head, not only at its changes, so a blocking finding may predate the pull request (an advisory published yesterday blocks every branch today). Fix it here, or merge the fix to the base branch and update this branch."
            echo "::notice title=gate scope::$note"
            summary "" "$note"
          fi
          exit "$fail"
