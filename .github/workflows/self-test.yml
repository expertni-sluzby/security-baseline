# This repo is its own first consumer: every change to baseline.yml runs baseline.yml,
# enforced, against this repo (zizmor audits the workflows that every consumer trusts).
# It is held to its own rules too, and it runs their tests (rules/, tests/; docs/baseline.md).
name: self-test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  baseline:
    uses: ./.github/workflows/baseline.yml
    permissions:
      contents: read
    with:
      enforce: true
      baseline-rules: enforce
      # Pull requests scan the changes (the default diff), pushes to main the whole repository: both paths of the
      # sast job run here.
      sast-push: full

  # A push to main that adds releases/vX.Y.Z.md releases that commit once the baseline above passed on it
  # (release.yml; docs/baseline.md, Versions). Any other push: the job finds nothing to release.
  release:
    needs: baseline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
