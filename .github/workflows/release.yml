# Releases the baseline (docs/baseline.md, Versions).
#
# - Release: a pull request adds releases/vX.Y.Z.md (first line the title, the rest the notes, both in Czech). After the
#   merge, self-test.yml runs the baseline on main and, once it passed, calls this workflow: it creates the release
#   vX.Y.Z at that commit and moves the major tag vX to it. Every consumer on @vX runs it at its next run.
# - Rollback: run this workflow by hand (Actions -> release -> Run workflow, or
#   `gh workflow run release.yml -f rollback=1.3.0`): it moves the major tag back to an existing release.
#
# Tags are created and moved by the GitHub App expertni-sluzby-baseline-release, the bypass actor of the rulesets
# release-tags-creation and major-tags (the built-in Actions token cannot be one). Its key is a secret of the
# environment `release`, which only main may use. Nothing from `${{ }}` is interpolated into a `run:` script.
name: release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      rollback:
        description: "Move the major tag back to this existing release (x.y.z)"
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    concurrency:
      group: security-baseline-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: What to release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$REF" != refs/heads/main ]; then
            echo "::error title=release::Only main releases (ref $REF)."
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            if ! printf '%s' "$ROLLBACK" | grep -Eqx "$semver"; then
              echo "::error title=release (invalid input)::rollback is '$ROLLBACK'; it takes a release x.y.z."
              exit 1
            fi
            tag="v$ROLLBACK"
            target=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
            if [ -z "$target" ]; then
              echo "::error title=release::$tag is not a release."
              exit 1
            fi
            mode=rollback
          else
            base="$BEFORE"
            if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
              base=$(git rev-parse "$SHA^")
            fi
            added=$(git diff --no-renames --diff-filter=A --name-only "$base" "$SHA" -- 'releases/v*.md')
            if [ -z "$added" ]; then
              echo "No releases/vX.Y.Z.md added by this push: nothing to release."
              echo "mode=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(printf '%s\n' "$added" | wc -l)" -ne 1 ]; then
              echo "::error title=release::One release per push; this one adds: $(printf '%s ' "$added")"
              exit 1
            fi
            file="$added"
            name=$(basename "$file" .md)
            ver="${name#v}"
            if [ "$name" = "$ver" ] || ! printf '%s' "$ver" | grep -Eqx "$semver"; then
              echo "::error file=$file,title=release::The file name is releases/vX.Y.Z.md."
              exit 1
            fi
            tag="v$ver"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error file=$file,title=release::$tag exists already; tags v*.*.* are immutable."
              exit 1
            fi
            latest=$(git tag -l 'v*.*.*' | sort -V | tail -1)
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
              echo "::error file=$file,title=release::$tag is not newer than $latest."
              exit 1
            fi
            title=$(sed -n '1{s/^#*[[:space:]]*//;p;q}' "$file")
            if [ -z "$title" ]; then
              echo "::error file=$file,line=1,title=release::The first line is the title."
              exit 1
            fi
            sed '1d' "$file" | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              echo "::error file=$file,title=release::The notes (after the first line) are empty."
              exit 1
            fi
            printf '%s — %s' "$tag" "$title" > "$RUNNER_TEMP/title.txt"
            target="$SHA"
            mode=release
          fi
          major="v${tag#v}"
          major="${major%%.*}"
          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "major=$major"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"
          echo "$mode: $tag at $target, major tag $major"
      - id: token
        if: steps.plan.outputs.mode != 'none'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: security-baseline
          permission-contents: write
      - name: Release and move the major tag
        if: steps.plan.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.plan.outputs.mode }}
          TAG: ${{ steps.plan.outputs.tag }}
          MAJOR: ${{ steps.plan.outputs.major }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then
            gh release create "$TAG" --repo "$REPO" --target "$TARGET" --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          before=$(gh api "repos/$REPO/git/ref/tags/$MAJOR" --jq .object.sha 2>/dev/null || true)
          if [ -n "$before" ]; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$MAJOR" -f sha="$TARGET" -F force=true >/dev/null
          else
            # A new major (v2): the ruleset major-tags must protect refs/tags/$MAJOR first (docs/baseline.md, Versions).
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$TARGET" >/dev/null
          fi
          now=$(gh api "repos/$REPO/git/ref/tags/$MAJOR" --jq .object.sha)
          if [ "$now" != "$TARGET" ]; then
            echo "::error title=release::$MAJOR points at $now, not $TARGET."
            exit 1
          fi
          {
            echo "### Release"
            if [ "$MODE" = release ]; then echo "Released **$TAG** at \`${TARGET:0:7}\`."; else echo "Rolled back to **$TAG** \`${TARGET:0:7}\`."; fi
            echo
            echo "\`$MAJOR\`: \`${before:0:7}\` → \`${TARGET:0:7}\`. Every consumer on \`@$MAJOR\` runs it at its next run."
          } >> "$GITHUB_STEP_SUMMARY"
