# Releases the baseline (docs/baseline.md, Versions).
#
# - Release: a pull request adds or changes releases/next.md (first line the title, the rest the notes, both in Czech).
#   The push of the merge to main starts this workflow. It counts the version from the latest release: the commits
#   since then decide (conventional commits: feat -> minor, anything else -> patch, "!"/BREAKING CHANGE -> v2, which is
#   never automatic), or "patch:" / "minor:" at the start of the first line. It waits until the self-test gate passed
#   on that commit, creates the release there and moves the major tag. Every consumer on @vX runs it at its next run.
# - By hand (Actions -> release -> Run workflow, or gh workflow run release.yml -f ...):
#   `release=true` releases releases/next.md at the head of main (when the automatic run could not),
#   `rollback=x.y.z` moves the major tag back to an existing release.
#
# Tags are created and moved by the GitHub App expertni-sluzby-baseline-release, the bypass actor of the rulesets
# release-tags-creation and major-tags (the built-in Actions token cannot be one). Its key is a secret of the
# environment `release`, which only main may use (a standalone workflow: a reusable one called from self-test.yml did
# not get the environment's secret). Nothing from `${{ }}` is interpolated into a `run:` script.
name: release

on:
  push:
    branches: [main]
    paths: ["releases/next.md"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release the notes in releases/next.md at the head of main (the version is counted as on a push)"
        required: false
        type: boolean
        default: false
      rollback:
        description: "Move the major tag back to this existing release (x.y.z); leave empty for a release"
        required: false
        type: string

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    concurrency:
      group: security-baseline-release
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: What to release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          RELEASE: ${{ inputs.release }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          next=releases/next.md
          if [ "$REF" != refs/heads/main ]; then
            echo "::error title=release::Only main releases (ref $REF)."
            exit 1
          fi
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -1)
          mode=release
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$RELEASE" = true ] && [ -n "$ROLLBACK" ]; then
              echo "::error title=release (invalid input)::Either release or rollback, not both."
              exit 1
            fi
            if [ -n "$ROLLBACK" ]; then
              mode=rollback
            elif [ "$RELEASE" != true ]; then
              echo "::error title=release (invalid input)::Set release (the notes in $next at the head of main) or rollback (x.y.z)."
              exit 1
            fi
          else
            base="$BEFORE"
            if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
              base=$(git rev-parse "$SHA^")
            fi
            if [ -z "$(git diff --no-renames --diff-filter=AM --name-only "$base" "$SHA" -- "$next")" ]; then
              echo "This push does not add or change $next: nothing to release."
              echo "mode=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$mode" = rollback ]; then
            if ! printf '%s' "$ROLLBACK" | grep -Eqx "$semver"; then
              echo "::error title=release (invalid input)::rollback is '$ROLLBACK'; it takes a release x.y.z."
              exit 1
            fi
            tag="v$ROLLBACK"
            target=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
            if [ -z "$target" ]; then
              echo "::error title=release::$tag is not a release."
              exit 1
            fi
            reason="rollback"
          else
            if [ ! -s "$next" ]; then
              echo "::error title=release::$next is missing or empty."
              exit 1
            fi
            if [ -z "$latest" ]; then
              echo "::error title=release::No release v*.*.* to count from."
              exit 1
            fi
            if [ "$(git rev-list --count "$latest..$SHA")" -eq 0 ]; then
              echo "::error title=release::Nothing new since $latest."
              exit 1
            fi
            first=$(sed -n '1{s/^#*[[:space:]]*//;p;q}' "$next")
            bump=""
            title="$first"
            # An explicit "patch:" or "minor:" on the first line wins; otherwise the commits since the latest release
            # decide (conventional commits): feat -> minor, anything else -> patch, "!" or BREAKING CHANGE -> v2.
            if printf '%s' "$first" | grep -Eq '^(patch|minor|major):'; then
              bump="${first%%:*}"
              title=$(printf '%s' "${first#*:}" | sed 's/^[[:space:]]*//')
              reason="first line of $next"
            else
              log=$(git log --no-merges --format='%s%n%b' "$latest..$SHA")
              if printf '%s\n' "$log" | grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE'; then
                bump=major
              elif printf '%s\n' "$log" | grep -Eq '^feat(\([^)]*\))?:'; then
                bump=minor
              else
                bump=patch
              fi
              reason="commits since $latest"
            fi
            if [ "$bump" = major ]; then
              echo "::error title=release::A breaking change ($reason) is v2: a new major tag that consumers move to in a pull request (docs/baseline.md, Versions); not released automatically."
              exit 1
            fi
            if [ -z "$title" ]; then
              echo "::error file=$next,line=1,title=release::The first line is the title."
              exit 1
            fi
            sed '1d' "$next" | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              echo "::error file=$next,title=release::The notes (after the first line) are empty."
              exit 1
            fi
            IFS=. read -r ma mi pa <<< "${latest#v}"
            if [ "$bump" = minor ]; then mi=$((mi + 1)); pa=0; else pa=$((pa + 1)); fi
            tag="v$ma.$mi.$pa"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error title=release::$tag exists already."
              exit 1
            fi
            printf '%s — %s' "$tag" "$title" > "$RUNNER_TEMP/title.txt"
            target="$SHA"
            reason="$bump from $latest ($reason)"
          fi
          major="${tag%%.*}"
          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "major=$major"
            echo "target=$target"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "$mode: $tag at $target, major tag $major ($reason)"
      - name: Wait for the self-test gate on this commit
        if: steps.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          # The baseline must have passed on exactly the commit that is released (self-test.yml, job baseline / gate).
          for _ in $(seq 1 90); do
            state=$(gh api "repos/$REPO/commits/$TARGET/check-runs?check_name=baseline%20%2F%20gate&per_page=20" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | if length == 0 then "missing" elif all(.status == "completed") then (if any(.conclusion == "success") then "success" else "failure" end) else "running" end') || state=api-error
            case "$state" in
              success) echo "self-test gate passed on $TARGET"; exit 0 ;;
              failure) echo "::error title=release::The self-test gate failed on $TARGET; nothing is released."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error title=release::The self-test gate did not finish on $TARGET within 30 minutes; nothing is released."
          exit 1
      - id: token
        if: steps.plan.outputs.mode != 'none'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: security-baseline
          permission-contents: write
      - name: Release and move the major tag
        if: steps.plan.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.plan.outputs.mode }}
          TAG: ${{ steps.plan.outputs.tag }}
          MAJOR: ${{ steps.plan.outputs.major }}
          TARGET: ${{ steps.plan.outputs.target }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then
            gh release create "$TAG" --repo "$REPO" --target "$TARGET" --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          before=$(gh api "repos/$REPO/git/ref/tags/$MAJOR" --jq .object.sha 2>/dev/null || true)
          if [ -n "$before" ]; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$MAJOR" -f sha="$TARGET" -F force=true >/dev/null
          else
            # A new major (v2): the ruleset major-tags must protect refs/tags/$MAJOR first (docs/baseline.md, Versions).
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$TARGET" >/dev/null
          fi
          now=$(gh api "repos/$REPO/git/ref/tags/$MAJOR" --jq .object.sha)
          if [ "$now" != "$TARGET" ]; then
            echo "::error title=release::$MAJOR points at $now, not $TARGET."
            exit 1
          fi
          {
            echo "### Release"
            if [ "$MODE" = release ]; then echo "Released **$TAG** at \`${TARGET:0:7}\` ($REASON)."; else echo "Rolled back to **$TAG** \`${TARGET:0:7}\`."; fi
            echo
            echo "\`$MAJOR\`: \`${before:0:7}\` → \`${TARGET:0:7}\`. Every consumer on \`@$MAJOR\` runs it at its next run."
          } >> "$GITHUB_STEP_SUMMARY"
